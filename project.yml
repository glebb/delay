name: DelayDisplay
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    PRODUCT_NAME: DelayDisplay
    PRODUCT_BUNDLE_IDENTIFIER: com.example.DelayDisplay
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  DelayDisplay:
    type: application
    platform: macOS
    sources:
      - path: DelayDisplay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DelayDisplay/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
